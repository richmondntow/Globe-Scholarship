[build]
  base = "netlify-app"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly enable SSR/API packaging for the nested Next.js application.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# @netlify/database enables native PostgreSQL provisioning and SQL migrations.
